<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIDZ STYLE</title><style>
:root{--ink:#061720;--teal:#14b9c5;--bg:#f4f7f8;--line:#d9e5e8;--muted:#65767d}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
header{position:sticky;top:0;z-index:20;background:#061720;color:#fff;padding:16px 5vw;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:28px;font-weight:900}.brand span{color:var(--teal)}header small{color:#c6d5d9}
.hero{padding:45px 5vw 22px;background:linear-gradient(135deg,#fff,#eaf8f9)}.hero h1{font-size:clamp(40px,7vw,78px);line-height:.94;margin:0 0 14px;letter-spacing:-3px}.hero h1 span{color:var(--teal)}.hero p{max-width:760px;font-size:18px;line-height:1.5;color:#3f555d}
main{padding:26px 5vw 60px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.category-card{padding:0;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff;text-align:left;cursor:pointer;box-shadow:0 10px 28px #06172012}
.category-card>img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.cat-meta{display:flex;gap:12px;align-items:center;padding:14px}.cat-meta>span{background:var(--teal);color:#fff;border-radius:999px;padding:8px;font-weight:800;font-size:12px}.cat-meta strong{display:block;font-size:17px}.cat-meta small{display:block;color:var(--muted);margin-top:4px;line-height:1.35}
.modal{position:fixed;inset:0;background:#031017e8;z-index:50;display:none;padding:14px;overflow:auto}.modal.open{display:block}.modal-shell{max-width:1120px;margin:auto;background:#fff;border-radius:22px;overflow:hidden}
.modal-head{position:sticky;top:0;z-index:4;background:#061720;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;font-size:20px}.close{border:0;background:#fff;width:38px;height:38px;border-radius:50%;font-size:22px;cursor:pointer}
.model-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px}.model-card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;padding:0;text-align:left;cursor:pointer}.crop{height:260px;background-repeat:no-repeat;background-color:#e8eef0}.model-card.selected{outline:4px solid var(--teal)}.model-label{padding:11px 12px 13px;display:flex;justify-content:space-between;align-items:center}.model-label strong{font-size:17px}.initial{font-size:12px;font-weight:900;color:#fff;background:#061720;border-radius:999px;padding:6px 9px}
.choice{margin:0 16px 18px;background:#edf8f9;border-radius:14px;padding:14px 16px;color:#405b63;display:none}.choice.show{display:block}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){header{padding:14px 18px}header small{display:none}.hero{padding:34px 18px 18px}main{padding:20px 18px 45px}.grid{grid-template-columns:1fr}.model-grid{grid-template-columns:1fr 1fr;padding:10px;gap:9px}.crop{height:205px}}
</style></head><body>
<header><div class="brand">KIDZ <span>STYLE</span></div><small>Kategorie wählen → Model wählen</small></header>
<section class="hero"><h1>WÄHLE DEINEN<br><span>STYLE.</span></h1><p>Tippe auf eine Kategorie. Danach öffnen sich alle neun Models einzeln. So kann der Kunde zuerst den Stil und anschließend sein gewünschtes Beispiel-Model auswählen.</p></section>
<main><div class="grid"><button class="category-card" data-title="Monogramm / Minimalistisch" data-image="01-monogramm.png">
<img src="01-monogramm.png" alt="Monogramm / Minimalistisch">
<div class="cat-meta"><span>01</span><div><strong>Monogramm / Minimalistisch</strong><small>Vorschau: Louis · antippen für alle 9 Models</small></div></div>
</button><button class="category-card" data-title="Graffiti & Urban" data-image="02-graffiti.png">
<img src="02-graffiti.png" alt="Graffiti & Urban">
<div class="cat-meta"><span>02</span><div><strong>Graffiti & Urban</strong><small>Vorschau: Jayden · antippen für alle 9 Models</small></div></div>
</button><button class="category-card" data-title="Futuristisch & Neon" data-image="03-futuristisch.png">
<img src="03-futuristisch.png" alt="Futuristisch & Neon">
<div class="cat-meta"><span>03</span><div><strong>Futuristisch & Neon</strong><small>Vorschau: Noah · antippen für alle 9 Models</small></div></div>
</button><button class="category-card" data-title="Street & Casual" data-image="04-street.png">
<img src="04-street.png" alt="Street & Casual">
<div class="cat-meta"><span>04</span><div><strong>Street & Casual</strong><small>Vorschau: Lina · antippen für alle 9 Models</small></div></div>
</button><button class="category-card" data-title="Vintage & Timeless" data-image="05-vintage.png">
<img src="05-vintage.png" alt="Vintage & Timeless">
<div class="cat-meta"><span>05</span><div><strong>Vintage & Timeless</strong><small>Vorschau: Mila · antippen für alle 9 Models</small></div></div>
</button><button class="category-card" data-title="Beach & Tropical" data-image="06-beach.png">
<img src="06-beach.png" alt="Beach & Tropical">
<div class="cat-meta"><span>06</span><div><strong>Beach & Tropical</strong><small>Vorschau: Leo · antippen für alle 9 Models</small></div></div>
</button><button class="category-card" data-title="Urban & Graffiti" data-image="07-urban.png">
<img src="07-urban.png" alt="Urban & Graffiti">
<div class="cat-meta"><span>07</span><div><strong>Urban & Graffiti</strong><small>Vorschau: Tyler · antippen für alle 9 Models</small></div></div>
</button><button class="category-card" data-title="Luxury & Premium" data-image="08-luxury.png">
<img src="08-luxury.png" alt="Luxury & Premium">
<div class="cat-meta"><span>08</span><div><strong>Luxury & Premium</strong><small>Vorschau: Yassin · antippen für alle 9 Models</small></div></div>
</button><button class="category-card" data-title="Wild & Animal" data-image="09-animal.png">
<img src="09-animal.png" alt="Wild & Animal">
<div class="cat-meta"><span>09</span><div><strong>Wild & Animal</strong><small>Vorschau: Ami · antippen für alle 9 Models</small></div></div>
</button></div></main>
<div class="modal" id="modal"><div class="modal-shell"><div class="modal-head"><h2 id="modalTitle">Kategorie</h2><button class="close" id="closeBtn">×</button></div><div class="model-grid" id="modelGrid"></div><div class="choice" id="choice"></div></div></div>
<script>
const models=[{"name": "Louis", "initial": "L"}, {"name": "Jayden", "initial": "J"}, {"name": "Noah", "initial": "N"}, {"name": "Lina", "initial": "L"}, {"name": "Mila", "initial": "M"}, {"name": "Leo", "initial": "L"}, {"name": "Tyler", "initial": "T"}, {"name": "Yassin", "initial": "Y"}, {"name": "Ami", "initial": "A"}];const modal=document.getElementById('modal');const modalTitle=document.getElementById('modalTitle');const modelGrid=document.getElementById('modelGrid');const choice=document.getElementById('choice');
function cropPosition(i){const c=i%3,r=Math.floor(i/3);return `${[0,50,100][c]}% ${[28,61,94][r]}%`;}
document.querySelectorAll('.category-card').forEach(card=>{card.addEventListener('click',()=>{const img=card.dataset.image,title=card.dataset.title;modalTitle.textContent=title;modelGrid.innerHTML='';choice.classList.remove('show');models.forEach((m,i)=>{const b=document.createElement('button');b.className='model-card';b.innerHTML=`<div class="crop"></div><div class="model-label"><strong>${m.name}</strong><span class="initial">${m.initial}</span></div>`;const crop=b.querySelector('.crop');crop.style.backgroundImage=`url('${img}')`;crop.style.backgroundSize='300% auto';crop.style.backgroundPosition=cropPosition(i);b.addEventListener('click',()=>{document.querySelectorAll('.model-card').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');choice.innerHTML=`Ausgewählt: <strong>${m.name}</strong> · Kategorie: <strong>${title}</strong><br><small>Als Nächstes verbinden wir diese Auswahl mit Foto-Upload und Namenseingabe.</small>`;choice.classList.add('show');});modelGrid.appendChild(b);});modal.classList.add('open');});});
function closeModal(){modal.classList.remove('open')}document.getElementById('closeBtn').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script></body></html>
